name: Build BYT LED APK
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore project
        run: |
          mkdir -p led-controller-android
          cat led-src/chunk*.b64 | base64 -d > /tmp/byt-led.zip
          unzip -q /tmp/byt-led.zip -d led-controller-android
      - name: Build APK
        working-directory: led-controller-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p output
          cp led-controller-android/app/build/outputs/apk/debug/app-debug.apk output/BYT-LED-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BYT-LED-APK
          path: output/BYT-LED-1.0.0.apk
          if-no-files-found: error
